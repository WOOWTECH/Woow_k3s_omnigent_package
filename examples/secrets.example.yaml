# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_omnigent_package — PLACEHOLDERS ONLY.
# Never commit real values, and never put them in a values file either: with
# secrets.create=false (the default) the chart only references these Secrets.
#
# Copy this file OUTSIDE the repo, replace every REPLACE_ME, then apply the copy:
#   kubectl --context woow-k3s -n omnigent apply -f /secure/path/omnigent-secrets.yaml
#
# Alternatively let Helm render them on a fresh install — every field is
# required(), so there is no weak default:
#   helm install omnigent charts/omnigent -n omnigent --create-namespace \
#     --set secrets.create=true \
#     --set admin.username=... --set admin.password=... \
#     --set postgres.password=...
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-admin
  namespace: omnigent
  labels:
    app.kubernetes.io/name: omnigent
  annotations:
    # Survive `helm uninstall` — matches what the chart renders with
    # keepOnUninstall=true.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # The first admin account. The setup-admin Job claims it via POST /auth/setup;
  # every runner and the host-gc CronJob log in with it.
  OMNIGENT_ADMIN_USERNAME: "REPLACE_ME_admin_user"
  # Generate one, e.g. `openssl rand -base64 24`. Quotes and backslashes are
  # JSON-escaped by the Job, so any printable password works.
  OMNIGENT_ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-postgres
  namespace: omnigent
  labels:
    app.kubernetes.io/name: omnigent
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # The probes and the DSN hardcode user and database "omnigent".
  POSTGRES_USER: "omnigent"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  POSTGRES_DB: "omnigent"
  # Only read when pgbouncer.enabled=false; with the sidecar on, the server
  # builds its own DSN against 127.0.0.1:6432 using POSTGRES_PASSWORD.
  # The password must match POSTGRES_PASSWORD above.
  DATABASE_URL: "postgresql+psycopg://omnigent:REPLACE_ME_PG_PASSWORD@omnigent-postgres:5432/omnigent"
---
# Cloudflare Tunnel credentials, in credentials-file mode (NOT token mode).
# scripts/apply.sh mints this Secret from a local credentials.json; this entry
# documents the shape. `helm install --set-file cloudflared.credentials=creds.json`
# makes the chart render it instead.
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-cloudflared-creds
  namespace: omnigent
  labels:
    app.kubernetes.io/name: omnigent
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  credentials.json: |
    {"AccountTag":"REPLACE_ME_ACCOUNT_TAG","TunnelID":"REPLACE_ME_TUNNEL_ID","TunnelSecret":"REPLACE_ME_TUNNEL_SECRET"}
  config.yaml: |
    tunnel: "REPLACE_ME_TUNNEL_ID"
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
