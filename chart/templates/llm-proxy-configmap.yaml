{{- /* #1449 LLM key proxy: nginx.conf + the init script that renders the key files
       (same render condition as llm-proxy.yaml; split out so the proxy Deployment can
       hash it without including itself). */ -}}
{{- $keys := include "omnigent.llmKeys" . | fromJson -}}
{{- if and .Values.runner.enabled .Values.llmProxy.enabled (or $keys.OPENROUTER_API_KEY $keys.ANTHROPIC_API_KEY) }}
{{- $name := include "omnigent.llmProxy.fullname" . -}}
{{- $up := .Values.llmProxy.upstreams -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "omnigent.llmProxy.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      server_tokens off;
      # No headers, no query strings: the token and the keys never reach the log.
      log_format woow '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
      access_log /dev/stdout woow;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size {{ .Values.llmProxy.clientMaxBodySize }};
      # Generated by the init container: resolver (the pod's DNS server) and the
      # token check (Authorization: Bearer <token> or x-api-key: <token>).
      # The token map keys are long ("Bearer " + 48+ chars).
      map_hash_bucket_size 256;
      include /run/llm/http.conf;
      map "$woow_bearer$woow_xkey" $woow_denied { "00" 1; default 0; }
      # Streaming (SSE) answers pass through unbuffered; long agent turns.
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_ssl_server_name on;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      server {
        listen {{ .Values.llmProxy.port }};
        location = /healthz { access_log off; return 200 "ok\n"; }
        location /openrouter/ {
          if ($woow_denied) { return 401 '{"error":{"message":"invalid WOOW LLM proxy token"}}'; }
          set $woow_upstream {{ $up.openrouter }};
          # Authorization: Bearer <real key> (or `return 503` without a key).
          include /run/llm/openrouter.conf;
          proxy_set_header x-api-key "";
          proxy_set_header Connection "";
          rewrite ^/openrouter(/.*)$ $1 break;
          proxy_pass https://$woow_upstream;
        }
        location /anthropic/ {
          if ($woow_denied) { return 401 '{"type":"error","error":{"type":"authentication_error","message":"invalid WOOW LLM proxy token"}}'; }
          set $woow_upstream {{ $up.anthropic }};
          # x-api-key: <real key> (or `return 503` without a key).
          include /run/llm/anthropic.conf;
          proxy_set_header Authorization "";
          proxy_set_header Connection "";
          rewrite ^/anthropic(/.*)$ $1 break;
          proxy_pass https://$woow_upstream;
        }
        location / { return 404; }
      }
    }
  render.sh: |
    #!/bin/sh
    # Writes /run/llm/*.conf (Memory emptyDir) from the proxy Secret. Values are
    # checked against a strict alphabet first — nothing that could break out of an
    # nginx string ("  ;  $  \  spaces, newlines) — and the init fails closed.
    set -eu
    # (length checked by the shell: busybox grep caps {m,n} at 255)
    ok() { [ ${#1} -ge 8 ] && [ ${#1} -le 512 ] && printf '%s' "$1" | grep -Eq '^[A-Za-z0-9._~+/=:-]+$'; }
    ok "$PROXY_TOKEN" || { echo "llm-proxy: proxy token malformed"; exit 1; }
    ns=$(awk '$1 == "nameserver" { print $2; exit }' /etc/resolv.conf)
    printf '%s' "$ns" | grep -Eq '^[0-9.]+$' || { echo "llm-proxy: no IPv4 nameserver in /etc/resolv.conf"; exit 1; }
    {
      printf 'resolver %s valid=60s ipv6=off;\n' "$ns"
      printf 'map $http_authorization $woow_bearer { default 0; "Bearer %s" 1; }\n' "$PROXY_TOKEN"
      printf 'map $http_x_api_key $woow_xkey { default 0; "%s" 1; }\n' "$PROXY_TOKEN"
    } > /run/llm/http.conf
    if [ -n "${OPENROUTER_API_KEY:-}" ]; then
      ok "$OPENROUTER_API_KEY" || { echo "llm-proxy: OpenRouter key has characters outside [A-Za-z0-9._~+/=:-]"; exit 1; }
      printf 'proxy_set_header Authorization "Bearer %s";\n' "$OPENROUTER_API_KEY" > /run/llm/openrouter.conf
    else
      printf 'return 503 %s;\n' "'{\"error\":{\"message\":\"no OpenRouter key on the WOOW service page\"}}'" > /run/llm/openrouter.conf
    fi
    if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
      ok "$ANTHROPIC_API_KEY" || { echo "llm-proxy: Anthropic key has characters outside [A-Za-z0-9._~+/=:-]"; exit 1; }
      printf 'proxy_set_header x-api-key "%s";\n' "$ANTHROPIC_API_KEY" > /run/llm/anthropic.conf
    else
      printf 'return 503 %s;\n' "'{\"type\":\"error\",\"error\":{\"type\":\"authentication_error\",\"message\":\"no Anthropic key on the WOOW service page\"}}'" > /run/llm/anthropic.conf
    fi
    chmod 0400 /run/llm/*.conf
    nginx -t -c /etc/llm-proxy/nginx.conf
    echo "llm-proxy: config written (openrouter=$([ -n "${OPENROUTER_API_KEY:-}" ] && echo on || echo off) anthropic=$([ -n "${ANTHROPIC_API_KEY:-}" ] && echo on || echo off))"
{{- end }}
