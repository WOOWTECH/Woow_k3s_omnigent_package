{{- if not .Values.auth.existingSecret }}
{{- /* admin_password: explicit (platform sensitive_values) wins; else reuse the live
       Secret's value; else generate once. omnigent reads it ONLY on first boot
       (empty DB) — afterwards the password lives in omnigent's DB and the tenant
       changes it there. cookie_secret signs session JWTs: generated once and kept
       stable (rotating it signs everyone out, including live runners). */ -}}
{{- $adminPassword := include "omnigent.resolveSecretValue" (dict "ctx" . "explicit" .Values.config.sensitive.admin_password "key" "admin_password") }}
{{- $cookieSecret := include "omnigent.resolveSecretValue" (dict "ctx" . "explicit" "" "key" "cookie_secret" "hex" true) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigent.secretName" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin_password: {{ $adminPassword | quote }}
  admin_username: {{ include "omnigent.adminUsername" . | quote }}
  cookie_secret: {{ $cookieSecret | quote }}
{{- end }}
{{- if .Values.runner.enabled }}
---
{{- /* Provider keys projected into every runner Pod via envFrom. Must exist before
       the first managed launch. Keys set on the live Secret (e.g. by the tenant or
       the platform) survive upgrades; runner.env adds/overrides. */ -}}
{{- $env := dict "OMNIGENT_PAAS_RUNNER" "1" -}}
{{- $live := lookup "v1" "Secret" .Release.Namespace (include "omnigent.runnerEnvSecretName" .) -}}
{{- if $live }}{{- range $k, $v := ($live.data | default dict) }}{{- $_ := set $env $k ($v | b64dec) }}{{- end }}{{- end }}
{{- range $k, $v := .Values.runner.env }}{{- $_ := set $env $k ($v | toString) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigent.runnerEnvSecretName" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
type: Opaque
stringData:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
