# WOOWTECH-specific overlay for the woow-k3s cluster deployment.
# Layered on top of values.yaml; only diffs from default live here.
#
# Apply via `helm install -f charts/omnigent/values.yaml -f charts/omnigent/values-woow.yaml`
# (scripts/apply.sh handles both).

server:
  baseUrl: https://omnigent.woowtech.io

# 3-way runner: pi1, pi4, pi5 as agreed with the operator.
# pi2 and pi3 are reserved (touched by other testing on the same cluster).
runner:
  hosts:
    - name: pi1
    - name: pi4
    - name: pi5

cloudflared:
  existingCredentialsSecret: omnigent-cloudflared-creds
