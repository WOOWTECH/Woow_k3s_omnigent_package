{{- /*
Optional Namespace resource. Off by default because `helm install --namespace X
--create-namespace` is the ergonomic path — turning this on covers the
"just apply the rendered YAML with kubectl" workflow instead.
*/ -}}
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
{{- end }}
