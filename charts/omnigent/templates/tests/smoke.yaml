{{- /*
`helm test` hook. Runs a curl smoke against the in-cluster server URL.

Assertions:
  - /health returns HTTP 200 with body containing "status":"ok"
  - /v1/info returns accounts_enabled=true and needs_setup=false
    (i.e. the post-install Job did its thing)

Runs as a Pod (not a Job) — that's the shape helm test expects.
*/ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke-{{ .Release.Revision }}
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ .Values.setupAdmin.image | quote }}
      command: [/bin/sh, -c]
      args:
        - |
          set -eu
          echo "== /health =="
          BODY=$(curl -sSf --max-time 5 http://omnigent-server:8000/health)
          echo "$BODY"
          case "$BODY" in
            *'"status":"ok"'*) echo "OK: /health returned status:ok" ;;
            *)                 echo "FAIL: unexpected /health body"; exit 1 ;;
          esac

          echo "== /v1/info =="
          INFO=$(curl -sSf --max-time 5 http://omnigent-server:8000/v1/info)
          echo "$INFO"
          case "$INFO" in
            *'"accounts_enabled":true'*) : ;;
            *) echo "FAIL: accounts_enabled != true"; exit 1 ;;
          esac
          case "$INFO" in
            *'"needs_setup":false'*) echo "OK: needs_setup=false (admin auto-claimed)" ;;
            *) echo "FAIL: needs_setup should be false after post-install Job"; exit 1 ;;
          esac

          echo "== /v1/hosts (auth required) =="
          TOKEN=$(curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' \
            --data "{\"username\":\"woow\",\"password\":\"woowtech2026\"}" \
            http://omnigent-server:8000/auth/login | \
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "FAIL: could not fetch a token — /auth/login returned no token"
            exit 1
          fi
          HOSTS=$(curl -sSf --max-time 5 -H "Authorization: Bearer $TOKEN" \
            http://omnigent-server:8000/v1/hosts)
          echo "$HOSTS" | head -c 400
          echo
          # After 30s or so, at least one runner should have registered.
          case "$HOSTS" in
            *'"online":true'*|*'"status":"online"'*) echo "OK: at least one online host" ;;
            *) echo "WARN: no online host in /v1/hosts yet — runners may still be booting" ;;
          esac
