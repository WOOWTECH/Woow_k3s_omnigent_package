{{- if and .Values.cloudflared.enabled .Values.cloudflared.credentials -}}
{{- /*
Optional in-chart Secret for cloudflared tunnel credentials.

Rendered ONLY when `.Values.cloudflared.credentials` is set (usually via
`helm install --set-file cloudflared.credentials=/path/to/creds.json` — see
README's "Install from GHCR" section). The typical git-clone flow uses
`scripts/apply.sh` which mints the Secret directly with `kubectl create secret`,
in which case we DON'T render this template and cloudflared-deployment.yaml
points at the operator-managed `existingCredentialsSecret` instead.

Rendering both is fine (existingSecret name defaults to the one we render
below), but supplying `credentials` here overrides the file-based flow.
*/ -}}
{{- /* Accept credentials as either a JSON string (--set-file) or a map (--set-json).
       Normalize to a JSON string. */ -}}
{{- $credsRaw := .Values.cloudflared.credentials -}}
{{- $credsMap := dict -}}
{{- $credsJson := "" -}}
{{- if kindIs "string" $credsRaw -}}
{{-   $credsJson = $credsRaw -}}
{{-   $credsMap = fromJson $credsRaw -}}
{{- else -}}
{{-   $credsJson = toJson $credsRaw -}}
{{-   $credsMap = $credsRaw -}}
{{- end -}}
{{- $tunnelId := .Values.cloudflared.tunnelId -}}
{{- if not $tunnelId -}}
{{-   $tunnelId = default "" (get $credsMap "TunnelID") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cloudflared.existingCredentialsSecret }}
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
type: Opaque
stringData:
  # cloudflared expects two files under /etc/cloudflared:
  #   credentials.json — tunnel {AccountTag, TunnelID, TunnelSecret}
  #   config.yaml      — points at that tunnel + sets metrics endpoint
  credentials.json: |
{{ $credsJson | indent 4 }}
  config.yaml: |
    tunnel: {{ $tunnelId | quote }}
    credentials-file: /etc/cloudflared/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
{{- end }}
