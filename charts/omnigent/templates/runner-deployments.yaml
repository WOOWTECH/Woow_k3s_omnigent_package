{{- /*
One PVC per entry in .Values.runner.hosts, plus a Deployment for every entry
that is not `enabled: false`. The host name flows through to the omnigent Web
UI as the registered host identifier — pi1, pi4, pi5 appear in the host picker.

`enabled: false` keeps the PVC and drops the Deployment. That is deliberate:
the pi-agent state on the volume (providers, sessions, credentials) is
expensive to rebuild, so parking a host must not destroy it, and re-enabling
the entry reattaches the same volume.

State is independent per runner (RWO): providers and sessions do NOT share
across runners or with the co-located pi-agent pods. The naming only mirrors
intent.
*/ -}}
{{- range $host := .Values.runner.hosts }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigent-runner-{{ $host.name }}-data
  namespace: {{ include "omnigent.namespace" $ }}
  labels:
    {{- include "omnigent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance-host: {{ $host.name }}
  {{- include "omnigent.keepAnnotations" $ | nindent 2 }}
spec:
  accessModes: {{ $.Values.runner.storage.accessModes | toJson }}
  storageClassName: {{ $.Values.runner.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $.Values.runner.storage.size | quote }}
{{- if eq (include "omnigent.hostEnabled" $host) "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent-runner-{{ $host.name }}
  namespace: {{ include "omnigent.namespace" $ }}
  labels:
    {{- include "omnigent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance-host: {{ $host.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omnigent.name" $ }}
      app.kubernetes.io/component: runner
      app.kubernetes.io/instance-host: {{ $host.name }}
  template:
    metadata:
      labels:
        {{- include "omnigent.labels" $ | nindent 8 }}
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance-host: {{ $host.name }}
    spec:
      # Wait until the admin account is claimed — otherwise the runner loop's
      # first /auth/login races the claim and falls into `sleep infinity`
      # (upstream design), needing a manual pod restart.
      #
      # The Job that does the claiming is an ordinary resource, not a
      # post-install hook, precisely so this wait can finish: Helm runs
      # post-install hooks only after `--wait` reports everything Ready, so as
      # a hook it deadlocked against this init container. See
      # templates/setup-admin-job.yaml.
      initContainers:
        - name: wait-admin-claim
          image: {{ $.Values.setupAdmin.image | quote }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              i=0
              until INFO=$(curl -sS --max-time 3 http://omnigent-server:8000/v1/info 2>/dev/null) && \
                    echo "$INFO" | grep -q '"needs_setup":false'; do
                i=$((i+1))
                if [ "$i" -ge {{ $.Values.runner.waitForAdminClaimAttempts }} ]; then
                  echo "[wait-admin-claim] admin still unclaimed — bailing so the pod restarts"
                  exit 1
                fi
                echo "[wait-admin-claim] admin not claimed yet (attempt $i) — sleep 5s"
                sleep 5
              done
              echo "[wait-admin-claim] admin claimed — proceeding to runner"
      containers:
        - name: runner
          image: {{ $.Values.runner.image | quote }}
          imagePullPolicy: {{ $.Values.runner.imagePullPolicy | quote }}
          env:
            - name: OMNIGENT_SERVER_URL
              value: http://omnigent-server:8000
            - name: OMNIGENT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.adminSecretName" $ }}
                  key: OMNIGENT_ADMIN_USERNAME
            - name: OMNIGENT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.adminSecretName" $ }}
                  key: OMNIGENT_ADMIN_PASSWORD
            - name: OMNIGENT_PI_PATH
              value: /usr/local/bin/pi-code
            - name: PI_CODING_AGENT_DIR
              value: /data/pi-agent
            - name: PI_TELEMETRY
              value: {{ $.Values.runner.piTelemetry | quote }}
            - name: PI_SKIP_VERSION_CHECK
              value: {{ $.Values.runner.piSkipVersionCheck | quote }}
            # Small hint to make each host distinguishable in `omnigent host` logs.
            - name: OMNIGENT_HOST_LABEL
              value: {{ $host.name | quote }}
          volumeMounts:
            - name: pi-agent-data
              mountPath: /data/pi-agent
          resources:
            {{- toYaml $.Values.runner.resources | nindent 12 }}
      volumes:
        - name: pi-agent-data
          persistentVolumeClaim:
            claimName: omnigent-runner-{{ $host.name }}-data
{{- end }}
{{- end }}
