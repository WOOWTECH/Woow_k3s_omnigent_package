{{- /*
One Deployment per entry in .Values.runner.hosts, each with a matching PVC.
The host name flows through to the omnigent Web UI as the registered host
identifier — pi1, pi4, pi5 become visible in the host picker.

State is independent per runner (Longhorn RWO): providers/sessions do NOT
share across runners or with the co-located pi-agent-N pods. The naming just
mirrors intent.
*/ -}}
{{- range $host := .Values.runner.hosts }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigent-runner-{{ $host.name }}-data
  namespace: {{ include "omnigent.namespace" $ }}
  labels:
    {{- include "omnigent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance-host: {{ $host.name }}
spec:
  accessModes: {{ $.Values.runner.storage.accessModes | toJson }}
  storageClassName: {{ $.Values.runner.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $.Values.runner.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent-runner-{{ $host.name }}
  namespace: {{ include "omnigent.namespace" $ }}
  labels:
    {{- include "omnigent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/instance-host: {{ $host.name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omnigent.name" $ }}
      app.kubernetes.io/component: runner
      app.kubernetes.io/instance-host: {{ $host.name }}
  template:
    metadata:
      labels:
        {{- include "omnigent.labels" $ | nindent 8 }}
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance-host: {{ $host.name }}
    spec:
      # Wait for the setup-admin post-install hook to finish claiming the
      # admin — otherwise the runner-loop's first /auth/login call races and
      # falls into `sleep infinity` (upstream design), needing a manual pod
      # restart. Cheap curl loop against /v1/info until needs_setup=false.
      initContainers:
        - name: wait-admin-claim
          image: {{ $.Values.setupAdmin.image | quote }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              i=0
              until INFO=$(curl -sS --max-time 3 http://omnigent-server:8000/v1/info 2>/dev/null) && \
                    echo "$INFO" | grep -q '"needs_setup":false'; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "[wait-admin-claim] admin still unclaimed after 5 min — bailing so pod restarts"
                  exit 1
                fi
                echo "[wait-admin-claim] admin not claimed yet (attempt $i) — sleep 5s"
                sleep 5
              done
              echo "[wait-admin-claim] admin claimed — proceeding to runner"
      containers:
        - name: runner
          image: {{ $.Values.runner.image | quote }}
          imagePullPolicy: {{ $.Values.runner.imagePullPolicy | quote }}
          env:
            - name: OMNIGENT_SERVER_URL
              value: http://omnigent-server:8000
            - name: OMNIGENT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: omnigent-admin
                  key: OMNIGENT_ADMIN_USERNAME
            - name: OMNIGENT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omnigent-admin
                  key: OMNIGENT_ADMIN_PASSWORD
            - name: OMNIGENT_PI_PATH
              value: /usr/local/bin/pi-code
            - name: PI_CODING_AGENT_DIR
              value: /data/pi-agent
            - name: PI_TELEMETRY
              value: {{ $.Values.runner.piTelemetry | quote }}
            - name: PI_SKIP_VERSION_CHECK
              value: {{ $.Values.runner.piSkipVersionCheck | quote }}
            # Small hint to make each host distinguishable in `omnigent host` logs.
            - name: OMNIGENT_HOST_LABEL
              value: {{ $host.name | quote }}
          volumeMounts:
            - name: pi-agent-data
              mountPath: /data/pi-agent
          resources:
            {{- toYaml $.Values.runner.resources | nindent 12 }}
      volumes:
        - name: pi-agent-data
          persistentVolumeClaim:
            claimName: omnigent-runner-{{ $host.name }}-data
{{- end }}
