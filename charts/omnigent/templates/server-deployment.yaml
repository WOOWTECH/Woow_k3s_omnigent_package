apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigent-server-data
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- include "omnigent.keepAnnotations" . | nindent 2 }}
spec:
  accessModes: {{ .Values.server.storage.accessModes | toJson }}
  storageClassName: {{ .Values.server.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.server.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnigent-server
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    # Recreate — the server holds a listening socket on the shared PVC path and
    # rolling would attach the new pod before the old one released it. Longhorn
    # RWO blocks that. Same call for the runners.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omnigent.name" . }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "omnigent.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      # WHY the pgbouncer sidecar (when .Values.pgbouncer.enabled is true):
      # ----------------------------------------------------------------------
      # The omnigent-server holds a SQLAlchemy pool of long-lived Postgres
      # sockets. When the omnigent-postgres StatefulSet pod restarts, those
      # sockets become half-closed and the driver's reconnect only kicks in
      # after several failed queries. In Resilience Test 3 (2026-08-31) this
      # manifested as ~125s of 5xx responses on /health while kubelet failed
      # liveness enough times to kill and restart the server pod itself.
      #
      # pgbouncer sits at 127.0.0.1:6432 inside this pod. It owns the backend
      # Postgres sockets; when Postgres flaps, pgbouncer reconnects
      # transparently and the server's pool keeps handing out working
      # client-side connections. Target recovery: <30s.
      #
      # Sizing matters as much as presence — see the pgbouncer block in
      # values.yaml for the 2026-09-08 saturation post-mortem.
      containers:
        - name: server
          image: {{ .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.server.imagePullPolicy | quote }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            {{- if .Values.pgbouncer.enabled }}
            # Route through the sidecar pgbouncer on localhost. The password
            # still comes from the same Secret so rotation stays single-source.
            - name: DATABASE_URL
              value: "postgresql+psycopg://omnigent:$(POSTGRES_PASSWORD)@127.0.0.1:6432/omnigent"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.postgresSecretName" . }}
                  key: DATABASE_URL
            {{- end }}
            - name: OMNIGENT_AUTH_ENABLED
              value: {{ if .Values.server.authEnabled }}"1"{{ else }}"0"{{ end }}
            - name: OMNIGENT_ACCOUNTS_BASE_URL
              value: {{ .Values.server.baseUrl | quote }}
            - name: ARTIFACT_DIR
              value: /data/artifacts
            - name: OMNIGENT_ADMIN_CREDENTIALS_PATH
              value: /data/admin-credentials
            {{- if .Values.server.accountsSessionTtlHours }}
            - name: OMNIGENT_ACCOUNTS_SESSION_TTL_HOURS
              value: {{ .Values.server.accountsSessionTtlHours | quote }}
            {{- end }}
            {{- if .Values.server.oidcSessionTtlHours }}
            - name: OMNIGENT_OIDC_SESSION_TTL_HOURS
              value: {{ .Values.server.oidcSessionTtlHours | quote }}
            {{- end }}
            {{- if .Values.server.features }}
            - name: OMNIGENT_FEATURES
              value: {{ .Values.server.features | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          # Never probe /healthz — it is shadowed by the React SPA catch-all
          # and returns HTML 200 even when FastAPI is dead. /health returns
          # {"status":"ok"} JSON only when the API is up.
          #
          # timeoutSeconds is set explicitly: omitting it lets Kubernetes apply
          # its 1s default, which is not enough for a health check that queries
          # Postgres. A slow pool then reads as "dead" and the kubelet restarts
          # a perfectly healthy server.
          readinessProbe:
            httpGet:
              path: {{ .Values.server.healthPath | quote }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.server.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.server.healthPath | quote }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.server.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: server-data
              mountPath: /data
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
        {{- if .Values.pgbouncer.enabled }}
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # AUTH_TYPE=trust — pgbouncer is only meant to be reached from the
            # server container over 127.0.0.1, so SCRAM negotiation (which the
            # bitnamilegacy image does not auto-configure with matching hashes)
            # is skipped. pgbouncer still authenticates itself against the real
            # Postgres with POSTGRESQL_PASSWORD.
            #
            # CAVEAT: the image binds 0.0.0.0, and 6432 is declared as a
            # containerPort, so any pod in the cluster that can reach this
            # pod IP gets an unauthenticated omnigent session. There is no
            # NetworkPolicy in this chart yet — tracked as a follow-up.
            - name: PGBOUNCER_AUTH_TYPE
              value: trust
            - name: POSTGRESQL_USERNAME
              value: omnigent
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_HOST
              value: omnigent-postgres
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: omnigent
            - name: PGBOUNCER_DATABASE
              value: omnigent
            - name: PGBOUNCER_POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: PGBOUNCER_MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: PGBOUNCER_DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: PGBOUNCER_MIN_POOL_SIZE
              value: {{ .Values.pgbouncer.minPoolSize | quote }}
            # Reserve pool absorbs short bursts above defaultPoolSize instead
            # of making clients queue on query_wait_timeout.
            - name: PGBOUNCER_RESERVE_POOL_SIZE
              value: {{ .Values.pgbouncer.reservePoolSize | quote }}
            - name: PGBOUNCER_RESERVE_POOL_TIMEOUT
              value: {{ .Values.pgbouncer.reservePoolTimeout | quote }}
            - name: PGBOUNCER_QUERY_WAIT_TIMEOUT
              value: {{ .Values.pgbouncer.queryWaitTimeout | quote }}
            # Ceiling across all pools; keeps pgbouncer below
            # postgres.tuning.maxConnections even if several pools fill at once.
            - name: PGBOUNCER_MAX_DB_CONNECTIONS
              value: {{ .Values.pgbouncer.maxDbConnections | quote }}
            - name: PGBOUNCER_SERVER_LIFETIME
              value: {{ .Values.pgbouncer.serverLifetime | quote }}
            - name: PGBOUNCER_SERVER_IDLE_TIMEOUT
              value: {{ .Values.pgbouncer.serverIdleTimeout | quote }}
            {{- with .Values.pgbouncer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            # No Service — pgbouncer is pod-local; the server container talks to
            # it via 127.0.0.1.
            - name: pgbouncer
              containerPort: 6432
          # TCP probe — the bitnamilegacy/pgbouncer image does not ship
          # pg_isready, so we test the socket instead. pgbouncer listens on
          # 6432 the moment the process is up.
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: {{ .Values.pgbouncer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pgbouncer.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.pgbouncer.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.pgbouncer.probes.readiness.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: {{ .Values.pgbouncer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.pgbouncer.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.pgbouncer.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.pgbouncer.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: omnigent-server-data
---
apiVersion: v1
kind: Service
metadata:
  name: omnigent-server
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "omnigent.name" . }}
    app.kubernetes.io/component: server
