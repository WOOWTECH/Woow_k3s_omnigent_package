{{- /*
One Secret feeding both the setup-admin Job and every runner Deployment. Keeps
the admin credentials in a single place — matches the podman sibling's model
of reading OMNIGENT_ADMIN_USERNAME/PASSWORD out of the runner quadlet.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-admin
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OMNIGENT_ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  OMNIGENT_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-postgres
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: omnigent
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: omnigent
  DATABASE_URL: {{ include "omnigent.databaseUrl" . | quote }}
