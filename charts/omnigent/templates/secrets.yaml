{{- /*
The admin and Postgres Secrets, rendered ONLY with secrets.create=true.

By default they are created out of band (see examples/secrets.example.yaml) and
the chart merely references them, so an upgrade can never overwrite live
credentials — and no password has to live in a values file in a public repo.

Every value is guarded by required(): there is no default, so `helm template
--set secrets.create=true` fails until real values are supplied.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigent.adminSecretName" . }}
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
  {{- include "omnigent.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  OMNIGENT_ADMIN_USERNAME: {{ required "admin.username is required when secrets.create=true" .Values.admin.username | quote }}
  OMNIGENT_ADMIN_PASSWORD: {{ required "admin.password is required when secrets.create=true" .Values.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omnigent.postgresSecretName" . }}
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
  {{- include "omnigent.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_USER: omnigent
  POSTGRES_PASSWORD: {{ required "postgres.password is required when secrets.create=true" .Values.postgres.password | quote }}
  POSTGRES_DB: omnigent
  DATABASE_URL: {{ include "omnigent.databaseUrl" . | quote }}
{{- end }}
