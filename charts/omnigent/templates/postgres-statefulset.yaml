apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omnigent-postgres
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: omnigent-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omnigent.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "omnigent.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          # Server tuning. The stock image ships max_connections=100, which
          # capped the whole connection chain regardless of how pgbouncer was
          # sized — see the pgbouncer sizing note in values.yaml.
          args:
            - postgres
            - -c
            - max_connections={{ .Values.postgres.tuning.maxConnections }}
            - -c
            - shared_buffers={{ .Values.postgres.tuning.sharedBuffers }}
            - -c
            - effective_cache_size={{ .Values.postgres.tuning.effectiveCacheSize }}
            - -c
            - maintenance_work_mem={{ .Values.postgres.tuning.maintenanceWorkMem }}
            - -c
            - work_mem={{ .Values.postgres.tuning.workMem }}
            - -c
            - max_worker_processes={{ .Values.postgres.tuning.maxWorkerProcesses }}
            - -c
            - max_parallel_workers={{ .Values.postgres.tuning.maxParallelWorkers }}
            - -c
            - max_parallel_workers_per_gather={{ .Values.postgres.tuning.maxParallelWorkersPerGather }}
          envFrom:
            - secretRef:
                name: {{ include "omnigent.postgresSecretName" . }}
          ports:
            - name: pg
              containerPort: 5432
          # timeoutSeconds set explicitly — the Kubernetes default of 1s makes
          # pg_isready flaky under load and can restart a healthy database.
          readinessProbe:
            exec:
              command: [pg_isready, -U, omnigent, -d, omnigent]
            initialDelaySeconds: {{ .Values.postgres.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgres.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.postgres.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.postgres.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: [pg_isready, -U, omnigent, -d, omnigent]
            initialDelaySeconds: {{ .Values.postgres.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.postgres.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.postgres.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.postgres.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            # Parallel query puts dynamic shared memory here; the runtime
            # default of 64Mi is too small once parallel workers are on.
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgres.shmSize | quote }}
  # NOTE: the volumeClaimTemplate PVC (data-omnigent-postgres-0) is owned by
  # the StatefulSet controller, not by Helm, so `helm uninstall` always leaves
  # it behind. keepOnUninstall therefore does not need to annotate it.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ .Values.postgres.storage.accessModes | toJson }}
        storageClassName: {{ .Values.postgres.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: omnigent-postgres
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Not headless: the StatefulSet's serviceName points here, so per-pod DNS
  # (omnigent-postgres-0.omnigent-postgres) does not resolve. Harmless at
  # replicas=1 and kept as-is because switching to clusterIP: None would have
  # to recreate the Service, changing its ClusterIP under the running server.
  type: ClusterIP
  ports:
    - name: pg
      port: 5432
      targetPort: pg
  selector:
    app.kubernetes.io/name: {{ include "omnigent.name" . }}
    app.kubernetes.io/component: postgres
