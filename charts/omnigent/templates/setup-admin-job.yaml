{{- if .Values.setupAdmin.enabled -}}
{{- /*
Claims the first admin account: waits for the server to serve /health, then
POSTs the credentials from the admin Secret to /auth/setup. Idempotent — a
second run sees needs_setup=false (or a 409) and exits 0.

WHY THIS IS NOT A HELM HOOK
---------------------------
It used to carry `helm.sh/hook: post-install,post-upgrade`. Helm 3 runs
post-install hooks only *after* `--wait` reports every resource Ready, while
each runner's wait-admin-claim init container blocks until the admin IS
claimed. So `helm install --wait` deadlocked on a fresh install:

  runners never Ready  ->  --wait burns its whole timeout  ->  release marked
  failed  ->  the post-install hook never runs  ->  admin never claimed.

Live escaped this only because the release predates the init container, so the
fresh-install path of the current chart had never actually been exercised.

Rendered as an ordinary Job (one per release revision, so upgrades get a fresh
immutable Job) it is created together with everything else: the claim and the
runners' wait converge, and `helm install --wait` succeeds. The cluster garbage
collects the finished Job after setupAdmin.ttlSecondsAfterFinished.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: omnigent-setup-admin-{{ .Release.Revision }}
  namespace: {{ include "omnigent.namespace" . }}
  labels:
    {{- include "omnigent.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup-admin
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: {{ .Values.setupAdmin.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "omnigent.labels" . | nindent 8 }}
        app.kubernetes.io/component: setup-admin
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: {{ .Values.setupAdmin.image | quote }}
          env:
            - name: OMNIGENT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.adminSecretName" . }}
                  key: OMNIGENT_ADMIN_USERNAME
            - name: OMNIGENT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "omnigent.adminSecretName" . }}
                  key: OMNIGENT_ADMIN_PASSWORD
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              echo "[setup-admin] waiting for omnigent-server /health"
              i=0
              until curl -sSf --max-time 3 http://omnigent-server:8000/health >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -ge 110 ]; then
                  echo "[setup-admin] server /health not answering — giving up"
                  exit 1
                fi
                sleep 5
              done
              echo "[setup-admin] server up"

              echo "[setup-admin] checking needs_setup"
              INFO=$(curl -sS --max-time 5 http://omnigent-server:8000/v1/info || echo '{}')
              NEEDS=$(echo "$INFO" | sed -n 's/.*"needs_setup":\([^,}]*\).*/\1/p' | tr -d ' ')
              echo "[setup-admin] needs_setup=$NEEDS"
              if [ "$NEEDS" != "true" ]; then
                echo "[setup-admin] admin already claimed — no-op"
                exit 0
              fi

              # JSON-escape the credentials instead of interpolating them raw.
              # A password containing " or \ used to produce invalid JSON, so
              # the claim failed and the only "safe" passwords were trivial
              # ones. Escapes backslash first, then the double quote.
              json_escape() {
                printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'
              }
              U=$(json_escape "$OMNIGENT_ADMIN_USERNAME")
              P=$(json_escape "$OMNIGENT_ADMIN_PASSWORD")

              echo "[setup-admin] POST /auth/setup as $OMNIGENT_ADMIN_USERNAME"
              CODE=$(curl -sS -o /tmp/resp -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' \
                --data "{\"username\":\"${U}\",\"password\":\"${P}\"}" \
                --max-time 10 http://omnigent-server:8000/auth/setup)
              case "$CODE" in
                200|201) echo "[setup-admin] admin created" ;;
                409)     echo "[setup-admin] admin already exists (409) — ok" ;;
                *)       echo "[setup-admin] /auth/setup returned $CODE:"; cat /tmp/resp; exit 1 ;;
              esac
{{- end }}
