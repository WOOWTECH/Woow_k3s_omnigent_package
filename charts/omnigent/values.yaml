# Default values for the omnigent chart.
# Override in values-woow.yaml (in-repo overlay) or via `helm install --set`.
#
# Named to match the podman sibling's Environment= lines so anyone reading both
# repos gets the same mental model.

namespace:
  # If create=true, the chart renders a Namespace resource. Set false when
  # `helm install --namespace X --create-namespace` is preferred (usual).
  create: false
  name: omnigent

# --- Admin credentials (single source of truth) ------------------------------
# Both the auto-claim Job (POST /auth/setup) and every runner's login curl
# read from this Secret. Change these before deploying outside your trust
# boundary — the chart values file is committed to a public repo.
admin:
  username: woow
  password: woowtech2026

# --- Postgres --------------------------------------------------------------
postgres:
  image: docker.io/library/postgres:16-alpine
  # postgres db password — internal only, never published.
  # DATABASE_URL is derived: postgresql+psycopg://omnigent:<password>@omnigent-postgres:5432/omnigent
  password: woowtech
  storage:
    size: 20Gi
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
  # max_connections must stay above pgbouncer.maxDbConnections with room to
  # spare for maintenance/superuser sessions. The stock postgres default of
  # 100 was the hard ceiling that made any pgbouncer resizing pointless.
  maxConnections: 500
  # Server tuning passed as `-c key=value` args to the postgres entrypoint.
  # Sized against the resources block below (shared_buffers ~= 1/6 of the
  # memory limit is the conventional starting point).
  sharedBuffers: 4GB
  effectiveCacheSize: 12GB
  maintenanceWorkMem: 512MB
  workMem: 16MB
  maxWorkerProcesses: 16
  maxParallelWorkers: 16
  maxParallelWorkersPerGather: 4
  # Postgres puts parallel-query dynamic shared memory in /dev/shm. The
  # container runtime default is 64Mi, which can fail large parallel scans,
  # so the chart mounts a tmpfs of this size at /dev/shm.
  shmSize: 2Gi
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "16"
      memory: 24Gi

# --- pgbouncer (server-pod sidecar) ----------------------------------------
# Sits inside the omnigent-server pod on 127.0.0.1:6432 and hands the server a
# connection pool that survives Postgres restarts. Without it, when the
# omnigent-postgres StatefulSet pod restarts the server's asyncpg pool holds
# stale broken sockets and takes ~125s (kubelet has to fail liveness enough
# times to kill and restart the server pod) to recover — measured in
# Resilience Test 3 on 2026-08-31. With pgbouncer the server reconnects
# through the pool front-end and target recovery is <30s.
#
# Pool mode is `session`. NOTE: the previous rationale here ("omnigent's
# FastAPI stack relies on asyncpg prepared statements") was wrong on both
# counts and is corrected as of 2026-09-09:
#   * The stack is **psycopg3**, not asyncpg — the DSN is
#     `postgresql+psycopg://` and tracebacks surface `psycopg/cursor.py`.
#   * pgbouncer 1.24.1 sets `max_prepared_statements=200` by default, which
#     handles protocol-level prepared statements in `transaction` mode fine.
# A source audit of omnigent 0.11.0 found no LISTEN/NOTIFY, no advisory
# locks, no temp tables and no WITH HOLD cursors. The only session-scoped
# state is `SET LOCAL statement_timeout` in the conversation store, and
# SET LOCAL reverts on commit. So `transaction` mode is in fact SAFE here.
#
# We still default to `session` because, with the sizing below, session mode
# no longer saturates — transaction mode would buy nothing at current load.
# Keep it as the documented escape hatch if connection counts ever get tight.
#
# Toggle: set `enabled: false` to revert to a direct
# `omnigent-postgres:5432` connection (server DATABASE_URL falls back to the
# Secret). Useful for A/B comparing pool vs. no-pool behaviour.
pgbouncer:
  enabled: true
  # bitnami/pgbouncer moved to bitnamilegacy (free tier) — bitnami/* now
  # requires the Bitnami Secure Images subscription. Legacy repo still
  # ships debian-12-suffixed immutable tags.
  image: docker.io/bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
  # session | transaction | statement. See the note above: `transaction` is
  # audited-safe for this app; `session` is the deliberate default.
  poolMode: session
  # --- Sizing -------------------------------------------------------------
  # These MUST track the server's SQLAlchemy engine, which is not tunable
  # from this chart. `omnigent/db/utils.py` hardcodes
  # `pool_size=200, max_overflow=20` (max 220 connections), deliberately
  # aligned with the AnyIO thread limiter in `server/app.py`
  # (`total_tokens = 200`). The app is therefore *designed* to open up to
  # 220 pooled connections.
  #
  # The old `defaultPoolSize: 25` was 8x below that ceiling, so in session
  # mode — where a client connection owns its server connection until it
  # disconnects — SQLAlchemy's long-lived connections pinned all 25 and the
  # pool ran permanently full. Symptom chain observed in prod on
  # 2026-09-08/09: `SHOW POOLS` at sv_active=25 / sv_idle=0 / maxwait=111s,
  # then `psycopg.errors.ProtocolViolation: query_wait_timeout` (120s cap)
  # → API 500s → /health exceeding its probe timeout → liveness SIGKILL of
  # the server container every ~30 min (exitCode 137, NOT an OOM).
  #
  # Chain now aligned: SQLAlchemy 220 max → pgbouncer 200 + 50 reserve
  # → maxDbConnections 400 → postgres maxConnections 500.
  maxClientConn: 1000
  defaultPoolSize: 200
  minPoolSize: 10
  reservePoolSize: 50
  reservePoolTimeout: 3
  # Ceiling across all pools for this database; keeps pgbouncer below
  # postgres.maxConnections even if several pools fill at once.
  maxDbConnections: 400
  # How long a client may wait for a server connection before pgbouncer
  # errors it out. Left at the pgbouncer default; with the sizing above it
  # should never be reached — if it is, that is the saturation alarm.
  queryWaitTimeout: 120
  serverLifetime: 3600
  serverIdleTimeout: 600
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi

# --- omnigent-server -------------------------------------------------------
server:
  image: ghcr.io/omnigent-ai/omnigent-server:latest
  imagePullPolicy: Always
  # Base URL exposed to browsers — must match the cloudflared ingress hostname.
  baseUrl: https://omnigent.woowtech.io
  # OMNIGENT_AUTH_ENABLED=1 = built-in accounts. Keep this on unless the
  # deployment is behind a trusted-LAN-only auth layer.
  authEnabled: true
  # Feature flags forwarded via OMNIGENT_FEATURES=. Comma-separated.
  # omnigent 0.12.0 supports exactly two: usage_page (adds Usage nav +
  # cost dashboard) and harness_install (enables Set-up-Claude-Code UI).
  # Unknown flags abort server boot, so keep to this list.
  features: "usage_page,harness_install"
  storage:
    # Persistent /data (admin-credentials file, artifacts). Small — server
    # rarely writes here.
    size: 5Gi
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      cpu: "16"
      memory: 24Gi
  # Podman version had this HTTP path issue too — /healthz is shadowed by
  # the React SPA catch-all and returns HTML 200 even when the API is dead.
  # /health returns {"status":"ok"} JSON. See docs/plans/2026-08-31-initial-package.md.
  healthPath: /health
  # Probe tuning. The chart previously set no timeoutSeconds at all, so
  # Kubernetes applied its default of **1 second** — far too tight for an
  # endpoint that touches the database. During the 2026-09-08 pool
  # saturation that 1s timeout is what converted DB slowness into a liveness
  # SIGKILL loop. Generous timeouts here make the probes report real
  # liveness instead of amplifying transient DB latency into a restart.
  probes:
    readiness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6

# --- runner ----------------------------------------------------------------
# One Deployment per entry; each dials into the server, registers a host,
# and holds its own pi-agent state on a dedicated Longhorn PVC.
runner:
  # Published as a multi-arch manifest list by Woow_podman_omnigent_package's
  # build.yml workflow — the `manifest` job composes the amd64 + arm64 per-arch
  # images into a single tag without an arch suffix, so the container runtime
  # picks the right architecture automatically on each node. No need to pick
  # amd64 vs arm64 in this file anymore. Tag `main` tracks the latest
  # main-branch build; use `main-<sha>` to pin. Per-arch tags
  # (`woow-omnigent-runner-amd64:*` / `-arm64:*`) are still published for
  # audit / rollback if you need to force a specific architecture.
  image: ghcr.io/woowtech/woow-omnigent-runner:main
  imagePullPolicy: Always
  # Chart provisions one Deployment per name in `hosts`, plus a matching PVC.
  # Names surface in the omnigent Web UI host picker exactly as written here.
  hosts:
    - name: pi1
    - name: pi4
    - name: pi5
  storage:
    size: 20Gi
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
  resources: {}
  # pi CLI env — mirrors runner quadlet.
  piTelemetry: "0"
  piSkipVersionCheck: "1"

# --- setup-admin Job (post-install hook) ------------------------------------
setupAdmin:
  enabled: true
  # curl image used by the Job. Pinned so a network hiccup in registry doesn't
  # break first-run admin claim.
  image: docker.io/curlimages/curl:8.10.1

# --- host-gc CronJob (stale-host cleanup) ----------------------------------
# Periodic sweep that logs (and, once upstream ships the endpoint, deletes)
# offline hosts from /v1/hosts. Closes W2-HIGH-3 / K3S-MED-1 from the sibling
# repos' E2E reports where every runner pod restart leaves an orphan host_id.
#
# STATUS 2026-09-09 (re-verified against omnigent 0.11.0 — supersedes the
# 2026-08-31 note): this CronJob CANNOT do its job, for three independent
# reasons. Recommend `enabled: false` until upstream changes.
#
#   1. The retention check can never fire. `GET /v1/hosts` returns exactly
#      host_id, name, owner, status, sandbox_provider, configured_harnesses
#      and gateway_inference (see server/routes/hosts.py::list_hosts).
#      There is **no last_seen_at field** — the script parses one that the
#      API has never emitted, so every host hits the "unparseable
#      last_seen_at" branch and is skipped. Liveness is computed server-side
#      from the DB column `hosts.updated_at`, which is not exposed.
#   2. There is still no DELETE. openapi.json confirms /v1/hosts/{host_id}
#      is GET-only. (host_store.py does implement delete_host(), but no
#      route exposes it.) So a fixed parser would only ever collect 405s.
#   3. There is nothing to collect. The `hosts` table holds 8 rows, all
#      real operator machines. The orphan-host accumulation this job was
#      written for (W2-HIGH-3 / K3S-MED-1) is not occurring here.
#
# The failure mode also isn't neutral: with dryRun=false and a "working"
# parser, the only row matching "offline > 60m" would be a developer laptop
# that was simply powered off overnight — deleting it would drop a real
# host from the picker. Until upstream ships both a timestamp field and a
# DELETE endpoint, leaving this disabled is strictly safer than fixing it.
hostGc:
  # Recommended: false. See the three findings above. Left true here so the
  # chart default does not silently change behaviour on existing installs;
  # operators should set this to false in their overlay.
  enabled: true
  schedule: "0 3 * * *"       # 03:00 UTC daily
  retentionMinutes: 60        # delete hosts offline > this many minutes
  image: docker.io/curlimages/curl:8.10.1
  dryRun: false               # while upstream lacks DELETE the job gracefully no-ops on 405; flip to true to force log-only

# --- cloudflared sidecar ---------------------------------------------------
# Terminates `omnigent.woowtech.io` at CF edge and tunnels to the in-cluster
# omnigent-server service. Uses cloudflare-managed config (ingress rules pushed
# via the CF API); the tunnel-token itself is in the referenced Secret.
cloudflared:
  enabled: true
  image: docker.io/cloudflare/cloudflared:2026.7.3
  replicas: 2
  # Name of the Secret cloudflared reads (credentials.json + config.yaml).
  # Two ways to populate it:
  #  (a) `scripts/apply.sh install` (git-clone flow) uses `kubectl create secret`
  #      to mint it from a local JSON file — see scripts/apply.sh.
  #  (b) OCI helm install (no git clone) — set `credentials:` below to the JSON
  #      contents; templates/cloudflared-secret.yaml renders the Secret.
  #      Enables `helm install oci://… --set-file cloudflared.credentials=creds.json`.
  existingCredentialsSecret: omnigent-cloudflared-creds
  # OCI install: paste JSON `{AccountTag, TunnelID, TunnelSecret}` here or via
  # `--set-file cloudflared.credentials=creds.json`. When non-empty, the chart
  # renders the Secret itself (no separate kubectl step). Leave empty to depend
  # on an operator-managed Secret named by `existingCredentialsSecret`.
  credentials: ""
  # Optional: override TunnelID in the rendered config.yaml. Defaults to
  # `.TunnelID` parsed out of `credentials` JSON via `fromJson`.
  tunnelId: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "4"
      memory: 2Gi
